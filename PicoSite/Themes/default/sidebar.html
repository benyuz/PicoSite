<aside class="sidebar">
    <h3>导航</h3>
    <ul class="nav-tree">
        {% for node in site.nav %}
            {% if node.Children.size > 0 %}
                <li class="nav-dir">
                    <span class="nav-dir-title">{{ node.Title }}</span>
                    <ul class="nav-children">
                        {% for child in node.Children %}
                            <li>
                                <a href="{{ site.base_url }}{{ child.Url }}"
                                   {% if child.Url == current_url %}class="active"{% endif %}>
                                    {{ child.Title }}
                                </a>
                            </li>
                        {% endfor %}
                    </ul>
                </li>
            {% else %}
                <li>
                    <a href="{{ site.base_url }}{{ node.Url }}"
                       {% if node.Url == current_url %}class="active"{% endif %}>
                        {{ node.Title }}
                    </a>
                </li>
            {% endif %}
        {% endfor %}
    </ul>
</aside>
