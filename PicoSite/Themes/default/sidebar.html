<aside class="docSidebarContainer">
  <div class="theme-doc-sidebar-menu menu">
    <ul class="menu__list">
      {% for node in site.nav %}
      {% if node.Children.size > 0 %}
      <li class="menu__list-item">
        <span class="menu__link menu__link--sublist" onclick="this.parentElement.classList.toggle('menu__list-item--collapsed')">
          {{ node.Title }}
        </span>
        <ul class="menu__list">
          {% for child in node.Children %}
          <li class="menu__list-item">
            <a href="{{ site.base_url }}{{ child.Url }}"
               class="menu__link {% if child.Url == current_url %}menu__link--active{% endif %}">
              {{ child.Title }}
            </a>
          </li>
          {% endfor %}
        </ul>
      </li>
      {% else %}
      <li class="menu__list-item">
        <a href="{{ site.base_url }}{{ node.Url }}"
           class="menu__link {% if node.Url == current_url %}menu__link--active{% endif %}">
          {{ node.Title }}
        </a>
      </li>
      {% endif %}
      {% endfor %}
    </ul>
  </div>
</aside>

<script>
(function() {
  // Auto-expand the current section in the sidebar
  var activeLink = document.querySelector('.menu__link--active');
  if (activeLink) {
    // Walk up to find the parent menu__list-item and ensure it's not collapsed
    var parent = activeLink.closest('.menu__list');
    if (parent) {
      var parentItem = parent.closest('.menu__list-item');
      if (parentItem) {
        parentItem.classList.remove('menu__list-item--collapsed');
        // Also expand grandparent if exists
        var grandparent = parentItem.closest('.menu__list');
        if (grandparent) {
          var gpItem = grandparent.closest('.menu__list-item');
          if (gpItem) {
            gpItem.classList.remove('menu__list-item--collapsed');
          }
        }
      }
    }
  }
})();
</script>
