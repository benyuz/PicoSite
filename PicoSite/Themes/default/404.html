<!DOCTYPE html>
<html lang="{{ site.language | default: "zh" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | {{ theme.i18n.not_found_title }}</title>
  <meta name="robots" content="noindex">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg,#ffffff);color:var(--fg,#1c1e21);display:flex;align-items:center;justify-content:center;padding:2rem}
    @media (prefers-color-scheme: dark){body{--bg:#1b1b1d;--fg:#e3e3e3}}
    .error-page{max-width:520px;width:100%;text-align:center;animation:fadeIn .4s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .error-page__code{font-size:6rem;font-weight:800;line-height:1;color:var(--accent,#2e8555);letter-spacing:-0.03em;text-shadow:0 8px 30px rgba(46,133,85,0.25)}
    .error-page__title{font-size:1.6rem;font-weight:700;margin:1rem 0 .5rem}
    .error-page__desc{color:var(--fg-muted,#606770);line-height:1.7;margin-bottom:2rem}
    @media (prefers-color-scheme: dark){.error-page__desc{--fg-muted:#9b9b9b}}
    .error-page__actions{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
    .button{display:inline-flex;align-items:center;padding:.55rem 1.2rem;border-radius:.5rem;font-size:.95rem;font-weight:600;text-decoration:none;transition:all .2s ease;border:1px solid transparent}
    .button--primary{background:var(--accent,#2e8555);color:#fff}
    .button--primary:hover{background:#277148;transform:translateY(-1px);box-shadow:0 4px 12px rgba(46,133,85,0.3)}
    .button--secondary{border-color:#dadde1;color:var(--fg,#1c1e21);background:transparent}
    .button--secondary:hover{border-color:var(--accent,#2e8555);color:var(--accent,#2e8555)}
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-page__code">404</div>
    <h1 class="error-page__title">{{ theme.i18n.not_found_title }}</h1>
    <p class="error-page__desc">{{ theme.i18n.not_found_desc }}</p>
    <div class="error-page__actions">
      <a href="{{ site.base_url }}/" class="button button--primary">{{ theme.i18n.back_home }}</a>
      <a href="javascript:history.back()" class="button button--secondary">{{ theme.i18n.back_prev }}</a>
    </div>
  </div>
</body>
</html>
