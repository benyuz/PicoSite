<!DOCTYPE html>
<html lang="{{ site.language | default: "zh" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | {{ theme.i18n.not_found_title }}</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232e8555'/%3E%3Cpath d='M9 22V10h5.2a3.8 3.8 0 0 1 0 7.6H11' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M15.4 17.6 19 22' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ site.base_url }}{{ theme.assets }}/style.css">
  <script>try{var t=localStorage.getItem('picosite-theme');if(!t&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
  <div class="error-page">
    <div class="error-page__card">
      <div class="error-page__code">404</div>
      <h1 class="error-page__title">{{ theme.i18n.not_found_title }}</h1>
      <p class="error-page__desc">{{ theme.i18n.not_found_desc }}</p>
      <div class="error-page__actions">
        <a href="{{ site.base_url }}/" class="button button--primary">{{ theme.i18n.back_home }}</a>
        <a href="javascript:history.back()" class="button button--secondary">{{ theme.i18n.back_prev }}</a>
      </div>
    </div>
  </div>
</body>
</html>
