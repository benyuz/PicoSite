<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - {{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="stylesheet" href="{{ site.base_url }}{{ theme.assets }}/style.css">
</head>
<body>
    {% include "header.html" %}

    <div class="container">
        {% include "sidebar.html" %}

        <main class="content page-content">
            <article>
                <h1>{{ page.title }}</h1>
                {% if page.date %}
                    <p class="date">{{ page.date }}</p>
                {% endif %}
                {{ content | raw }}
            </article>
        </main>
    </div>

    {% include "footer.html" %}
</body>
</html>
