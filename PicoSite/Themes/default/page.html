<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - {{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="stylesheet" href="{{ site.base_url }}{{ theme.assets }}/style.css">
    <script>try{var t=localStorage.getItem('picosite-theme');if(!t&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
    {% include "header.html" %}

    <div class="layout">
        {% include "sidebar.html" %}

        <main class="main">
            <div class="doc page-content">
                <nav class="breadcrumbs">
                    <a href="{{ site.base_url }}/">{{ theme.i18n.home }}</a>
                    <span class="sep">/</span>
                    <span>{{ page.title }}</span>
                </nav>
                <article>
                    <h1>{{ page.title }}</h1>
                    {% if page.date %}
                        <p class="page-date">{{ page.date }}</p>
                    {% endif %}
                    {{ content | raw }}
                </article>
            </div>
        </main>
    </div>

    {% include "footer.html" %}
</body>
</html>
