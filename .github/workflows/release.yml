name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      # 打 tag 自动创建 Release（含自动生成的发布说明）；手动发布时跳过
      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PicoSite ${{ github.ref_name }}
          generate_release_notes: true

  publish-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      - name: Publish (win-x64)
        run: |
          dotnet publish PicoSite/PicoSite.csproj `
            --configuration Release `
            --runtime win-x64 `
            -p:DebugType=embedded `
            --output ./publish/win-x64

      - name: Upload Release Asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./publish/win-x64/picosite.exe
          asset_name: picosite-win-x64.exe
          tag: ${{ github.ref_name }}
          overwrite: true

  publish-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      - name: Publish (linux-x64)
        run: |
          dotnet publish PicoSite/PicoSite.csproj \
            --configuration Release \
            --runtime linux-x64 \
            -p:DebugType=embedded \
            --output ./publish/linux-x64

      - name: Upload Release Asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./publish/linux-x64/picosite
          asset_name: picosite-linux-x64
          tag: ${{ github.ref_name }}
          overwrite: true

  publish-macos:
    needs: create-release
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      - name: Publish (${{ matrix.rid }})
        run: |
          dotnet publish PicoSite/PicoSite.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            -p:DebugType=embedded \
            --output ./publish/${{ matrix.rid }}

      - name: Upload Release Asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./publish/${{ matrix.rid }}/picosite
          asset_name: picosite-${{ matrix.rid }}
          tag: ${{ github.ref_name }}
          overwrite: true
